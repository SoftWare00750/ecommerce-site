<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout — ShopIt</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkout-wrapper {
      max-width: 680px;
      margin: 60px auto;
      padding: 0 24px 80px;
    }

    .checkout-wrapper h1 {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .checkout-wrapper .subtitle {
      color: #777;
      margin-bottom: 32px;
      font-size: 15px;
    }

    .checkout-section {
      background: white;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .checkout-section h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: #333;
    }

    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      color: #555;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select {
      padding: 11px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      background: white;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #4f46e5;
    }

    /* Order summary */
    .order-line {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #555;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .order-line:last-of-type {
      border-bottom: none;
    }

    .order-grand {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 700;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid #eee;
    }

    .empty-cart-msg {
      text-align: center;
      color: #999;
      padding: 20px 0;
    }

    #place-order-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.4px;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.35);
    }

    #place-order-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #4f46e5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .back-link:hover { text-decoration: underline; }

    /* Success overlay */
    #success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    #success-overlay.show {
      display: flex;
    }

    .success-box {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .success-icon {
      font-size: 52px;
      margin-bottom: 16px;
    }

    .success-box h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .success-box p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .success-box button {
      background: #4f46e5;
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header class="navbar">
  <h2 class="logo">ShopIt</h2>
  <nav>
    <a href="index.html">← Back to Store</a>
    <a href="cart.html">Cart 🛒</a>
  </nav>
</header>

<div class="checkout-wrapper">
  <a href="index.html" class="back-link">← Continue shopping</a>
  <h1>Checkout</h1>
  <p class="subtitle">Fill in your details to complete your order.</p>

  <!-- Order Summary -->
  <div class="checkout-section">
    <h2>Order Summary</h2>
    <div id="order-summary-lines"></div>
    <div class="order-grand">
      <span>Total</span>
      <span id="order-grand-total"></span>
    </div>
  </div>

  <!-- Shipping Info -->
  <div class="checkout-section">
    <h2>Shipping Information</h2>
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" placeholder="John" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" placeholder="Doe" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="john@example.com" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" placeholder="+234 800 000 0000" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Address</label>
        <input type="text" placeholder="123 Main Street" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>City</label>
        <input type="text" placeholder="Lagos" />
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" placeholder="Lagos State" />
      </div>
    </div>
  </div>

  <!-- Payment -->
  <div class="checkout-section">
    <h2>Payment Details</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" id="card-number" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Expiry Date</label>
        <input type="text" placeholder="MM / YY" maxlength="7" id="card-expiry" />
      </div>
      <div class="form-group">
        <label>CVV</label>
        <input type="text" placeholder="123" maxlength="3" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Name on Card</label>
        <input type="text" placeholder="John Doe" />
      </div>
    </div>
  </div>

  <button id="place-order-btn" onclick="placeOrder()">Place Order</button>
</div>

<!-- Success Modal -->
<div id="success-overlay">
  <div class="success-box">
    <div class="success-icon">🎉</div>
    <h2>Order Placed!</h2>
    <p>Thank you for shopping with ShopIt. Your order is confirmed and will be delivered soon.</p>
    <button onclick="window.location.href='index.html'">Back to Store</button>
  </div>
</div>

<script>
  function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
  }

  function renderSummary() {
    const cart = getCart();
    const linesEl = document.getElementById("order-summary-lines");
    const grandEl = document.getElementById("order-grand-total");

    if (cart.length === 0) {
      linesEl.innerHTML = '<p class="empty-cart-msg">Your cart is empty. <a href="index.html">Go shopping →</a></p>';
      grandEl.textContent = "₦0";
      return;
    }

    linesEl.innerHTML = cart.map(item => `
      <div class="order-line">
        <span>${item.name} × ${item.quantity}</span>
        <span>₦${(item.price * item.quantity).toLocaleString()}</span>
      </div>
    `).join("");

    const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
    grandEl.textContent = `₦${total.toLocaleString()}`;
  }

  // Format card number with spaces
  document.getElementById("card-number").addEventListener("input", function (e) {
    let v = e.target.value.replace(/\D/g, "").substring(0, 16);
    e.target.value = v.replace(/(.{4})/g, "$1 ").trim();
  });

  // Format expiry
  document.getElementById("card-expiry").addEventListener("input", function (e) {
    let v = e.target.value.replace(/\D/g, "").substring(0, 4);
    if (v.length >= 3) v = v.substring(0,2) + " / " + v.substring(2);
    e.target.value = v;
  });

  function placeOrder() {
    const cart = getCart();
    if (cart.length === 0) {
      alert("Your cart is empty!");
      return;
    }
    // Clear cart
    localStorage.removeItem("cart");
    document.getElementById("success-overlay").classList.add("show");
  }

  renderSummary();
</script>
</body>
</html>
