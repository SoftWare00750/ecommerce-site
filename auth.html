<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup — ShopIt</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f0ff 0%, #faf5ff 100%);
    }

    .auth-container {
      background: white;
      padding: 48px 40px 40px;
      width: 340px;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(79, 70, 229, 0.12);
      text-align: center;
    }

    .auth-logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .auth-container h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .auth-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .auth-input:focus {
      border-color: #4f46e5;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-login {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-signup {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: white;
      color: #4f46e5;
      border: 1.5px solid #4f46e5;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-signup:hover {
      background: #f5f3ff;
      transform: translateY(-1px);
    }

    .auth-msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 13.5px;
      display: none;
    }

    .auth-msg:not(:empty) {
      display: block;
    }

    .auth-msg--error {
      background: #fff0f0;
      color: #c53030;
      border: 1px solid #fca5a5;
    }

    .auth-msg--success {
      background: #f0fff4;
      color: #276749;
      border: 1px solid #86efac;
    }

    .auth-back {
      display: block;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      text-decoration: none;
    }

    .auth-back:hover {
      color: #4f46e5;
    }
  </style>
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-logo">ShopIt</div>
  <p class="auth-subtitle">Premium Tech &amp; Fashion</p>
  <h2>Welcome back</h2>

  <input class="auth-input" type="text" id="username" placeholder="Username" autocomplete="username" />
  <input class="auth-input" type="password" id="password" placeholder="Password" autocomplete="current-password" />

  <div class="auth-buttons">
    <button class="btn-login" onclick="login()">Login</button>
    <button class="btn-signup" onclick="signup()">Sign Up</button>
  </div>

  <p id="auth-message" class="auth-msg"></p>
  <a class="auth-back" href="index.html">← Back to Store</a>
</div>

<script src="public/js/auth.js"></script>
</body>
</html>
